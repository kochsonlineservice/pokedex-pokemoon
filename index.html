<!doctype html>
<html lang="en">
  <head>
    <!-- Grundlegende Einstellungen -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Pokedex</title>

    <meta
      name="description"
      content="Entdecke Pokémon und ihre Informationen in diesem modernen Pokedex."
    />

    <meta
      name="keywords"
      content="Pokémon, Pokedex, Pokemon Informationen, Pokémon Suche"
    />

    <meta name="author" content="Ralph Koch" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://deine-domain.de/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pokedex" />
    <meta
      property="og:description"
      content="Entdecke Pokémon und ihre Informationen in diesem modernen Pokedex."
    />
    <meta property="og:url" content="https://deine-domain.de/" />
    <meta
      property="og:image"
      content="https://deine-domain.de/assets/images/social-preview.jpg"
    />
    <meta property="og:site_name" content="Pokedex" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokedex" />
    <meta
      name="twitter:description"
      content="Entdecke Pokémon und ihre Informationen in diesem modernen Pokedex."
    />
    <meta
      name="twitter:image"
      content="https://deine-domain.de/assets/images/social-preview.jpg"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="header"></div>

    <main id="content" data-id="content">
    <ul id="pokemon-list"></ul>
   </main>

    <button
    id="load-more-button"
    class="load-more-button"
    data-id="load-more-button"
    aria-label="Load more Pokémon"
>
    Load More
</button>

    <dialog
    id="dialog"
    data-id="dialog"
    aria-label="Pokémon details"
>
      <img
        id="grossesBild"
        data-id="dialog-image"
        class="large-img"
        alt="Vergrößertes Bild"
      />

      <button
        class="btn_close"
        data-id="close-dialog-button"
        aria-label="Dialog schließen"
      >
        ✕
      </button>

      <button
        class="btn_left"
        data-id="prev-button"
        aria-label="Vorheriges Bild"
      >
        <svg viewBox="0 0 24 24" width="30" height="30">
          <path
            d="M15 6 L9 12 L15 18"
            stroke="currentColor"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <p class="bildText" id="bildText" data-id="overlay-pokemon-name"></p>

      <p id="pokemonType"></p>
      <p id="pokemonHp"></p>
      <p id="pokemonAttack"></p>
      <p id="pokemonDefense"></p>
      <p id="pokemonEvolution"></p>

      <button
        class="btn_right"
        data-id="next-button"
        aria-label="Nächstes Bild"
      >
        <svg viewBox="0 0 24 24" width="30" height="30">
          <path
            d="M9 6 L15 12 L9 18"
            stroke="currentColor"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </dialog>

    <div id="footer"></div>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
